<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>舉一反三｜中文字益智遊戲</title>
  <meta name="description" content="注音 + 中文字部件，猜出正確中文字的 K12 益智小遊戲。" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- ===== 開始畫面 ===== -->
    <section id="start-screen" class="screen screen--active">
      <div class="card start-card">
        <h1 class="title">舉一反三 <span class="title__spark">✦</span></h1>
        <p class="subtitle">注音 ＋ 部件，猜出正確的中文字！</p>

        <div class="howto">
          <h2 class="howto__head">怎麼玩？</h2>
          <ol class="howto__list">
            <li>左邊會出現一個<strong>注音符號</strong>（例如「ㄅ」）。</li>
            <li>右邊有 3 張<strong>部件圖卡</strong>（例如「宀」「扌」「艹」）。</li>
            <li>每一格填入一個中文字，<strong>讀音要以該注音開頭</strong>，而且<strong>字形要含有該部件</strong>。</li>
          </ol>
          <p class="howto__example">例：注音「ㄅ」＋部件「宀」→ 可填「寶」；＋「扌」→「抱」；＋「艹」→「苞」。</p>
        </div>

        <h2 class="pick-head">選擇難度開始遊戲</h2>
        <div id="difficulty-options" class="difficulty-options"><!-- 由 game.js 產生 --></div>
        <p class="pick-note">難度只影響每一題的倒數時間，題目規則完全相同。</p>
      </div>
    </section>

    <!-- ===== 遊戲畫面 ===== -->
    <section id="game-screen" class="screen" hidden>
      <header class="topbar">
        <div class="topbar__name">舉一反三</div>
        <div class="stats">
          <div class="stat"><span class="stat__label">分數</span><span id="stat-score" class="stat__value">0</span></div>
          <div class="stat"><span class="stat__label">題號</span><span id="stat-round" class="stat__value">1 / 1</span></div>
          <div class="stat"><span class="stat__label">剩餘時間</span><span id="stat-time" class="stat__value">--</span></div>
        </div>
      </header>

      <main class="play">
        <!-- 左：注音大卡 -->
        <div class="zhuyin-wrap">
          <div class="zhuyin-label">本題注音</div>
          <div id="zhuyin-card" class="zhuyin-card">ㄅ</div>
        </div>

        <!-- 右：三列題目 -->
        <div class="answers">
          <p id="rule-text" class="rule-text"></p>
          <div id="answer-rows" class="answer-rows"><!-- 由 game.js 產生 --></div>
          <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        </div>
      </main>

      <footer class="controls">
        <button id="btn-submit" class="btn btn--primary" type="button">送出答案</button>
        <button id="btn-next" class="btn btn--accent" type="button" hidden>下一題</button>
        <button id="btn-restart" class="btn btn--ghost" type="button">重新開始</button>
      </footer>
    </section>

    <!-- ===== 結算畫面 ===== -->
    <section id="results-screen" class="screen" hidden>
      <div class="card results-card">
        <h1 class="title">遊戲結束 🎉</h1>
        <div class="results-grid">
          <div class="result-box result-box--score">
            <span class="result-box__label">總分</span>
            <span id="res-score" class="result-box__value">0</span>
          </div>
          <div class="result-box">
            <span class="result-box__label">答對格數</span>
            <span class="result-box__value"><span id="res-correct">0</span> / <span id="res-total-cells">0</span></span>
          </div>
          <div class="result-box">
            <span class="result-box__label">總回合數</span>
            <span id="res-rounds" class="result-box__value">0</span>
          </div>
          <div class="result-box">
            <span class="result-box__label">正確率</span>
            <span id="res-accuracy" class="result-box__value">0%</span>
          </div>
        </div>
        <p id="res-bonus" class="results-bonus"></p>
        <div class="results-actions">
          <button id="btn-play-again" class="btn btn--primary" type="button">再玩一次</button>
          <button id="btn-home" class="btn btn--ghost" type="button">回到首頁（換難度）</button>
        </div>
      </div>
    </section>

  </div>

  <script src="questions.js"></script>
  <script src="data/dict.js"></script>
  <script src="validator.js"></script>
  <script src="game.js"></script>
</body>
</html>
